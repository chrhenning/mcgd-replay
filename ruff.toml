line-length = 88

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D"]
# ruff-format handles line breaking; E501 only fires on strings it can't split.
ignore = ["E501"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/*" = ["D1"]
"**/__init__.py" = ["D104"]
"scripts/*" = ["D103"]
